services:
  pgvector-db:
    image: pgvector/pgvector:pg17
    container_name: ai-pdf-qa-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgvector-data:/var/lib/postgresql/data

volumes:
  pgvector-data: